<header><button style="float:right" onclick="tab='Settings';render()">⚙ Settings</button><h1>IC Reconciliation</h1><span>Intercompany reconciliation · Local workspace</span></header><nav id="nav"></nav><p id="notice" role="alert"></p><main id="main"></main>
<script>
let state,tab='Dashboard',selectedHistory=null;
const tabs=['Dashboard','Imports','Exceptions','History','Mappings'];
const accountingLabel=value=>({'Patrimonio':'Equity','Balance':'Balance Sheet','Balances':'Balances'}[value]||value);
const mappingLabel=value=>String(value).split('/').map(accountingLabel).join('/');
const escapeHTML=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const storageKey='ic-reconciliation-workspace-v1';
let browserState;
function decimal(value){
 const text=String(value).trim();
 if(!/^[+-]?\d+(\.\d{1,8})?$/.test(text))throw Error('Invalid amount or exchange rate: '+text+' (maximum 8 decimal places)');
 const negative=text.startsWith('-'),parts=text.replace(/^[+-]/,'').split('.');
 return (negative?-1n:1n)*(BigInt(parts[0])*100000000n+BigInt((parts[1]||'').padEnd(8,'0')));
}
function decimalText(value){const negative=value<0n;const absolute=negative?-value:value;return (negative?'-':'')+(absolute/100000000n).toString()+'.'+(absolute%100000000n).toString().padStart(8,'0');}
function csvRows(text){
 text=text.replace(/^\uFEFF/,'');
 const first=text.split(/\r?\n/)[0],separator=first.includes(';')?';':',';
 const rows=[];let row=[],field='',quoted=false;
 for(let index=0;index<text.length;index++){
  const character=text[index];
  if(character==='"'){
   if(quoted&&text[index+1]==='"'){field+='"';index++;}else quoted=!quoted;
  }else if(character===separator&&!quoted){row.push(field);field='';}
  else if((character==='\n'||character==='\r')&&!quoted){if(character==='\r'&&text[index+1]==='\n')index++;row.push(field);if(row.some(value=>value.trim()))rows.push(row);row=[];field='';}
  else field+=character;
 }
 if(quoted)throw Error('CSV contains unclosed quotes');
 row.push(field);if(row.some(value=>value.trim()))rows.push(row);
 if(rows.length<2)throw Error('The file contains no records');
 const headers=rows.shift().map(value=>value.trim());
 if(new Set(headers).size!==headers.length)throw Error('Duplicate columns found');
 return rows.map((values,index)=>{if(values.length!==headers.length)throw Error('Incorrect column count on row '+(index+2));return Object.fromEntries(headers.map((header,column)=>[header,values[column].trim()]));});
}
function importRows(payload,workspace){
 const company=workspace.companies.find(item=>item.id===payload.company_id);
 const mappingRecord=workspace.mappings.find(item=>item.name===payload.mapping);
 if(!company||!mappingRecord)throw Error('Select a company and mapping');
 const mapping=JSON.parse(mappingRecord.data),statement=payload.mapping.split('/')[1];
 return csvRows(payload.csv).map((source,index)=>{
  const row=Object.fromEntries(['entity','counterparty','account','period','currency','amount','reference','date','category'].map(field=>[field,source[mapping[field]||field]||'']));
  if(row.entity&&row.entity!==company.name)throw Error('Row '+(index+2)+': company does not match the selected company');
  row.entity=company.name;row.statement=statement;row.category=row.category||statement;
  row.category=({'Equity':'Patrimonio','Balance Sheet':'Balance'}[row.category]||row.category);
  for(const field of ['counterparty','account','period','currency','amount'])if(!row[field])throw Error('Row '+(index+2)+': missing '+field);
  if(!['Balance','P&L','Patrimonio'].includes(row.category)||(statement==='P&L'&&row.category!=='P&L')||(statement==='Balance'&&row.category==='P&L'))throw Error('Category is incompatible with the statement');
  decimal(row.amount);row.currency=row.currency.toUpperCase();return row;
 });
}
function browserReconcile(rows,options){
 const groups=new Map(),tolerance=decimal(options.tolerance);
 if(tolerance<0n)throw Error('Negative tolerance');
 for(const entry of rows){
  const row={...entry},category=row.category||row.statement,method=options.methods[category];
  if(row.entity===row.counterparty)throw Error('A company cannot be its own counterparty');
  if(!options.currencies.includes(row.currency))throw Error('Currency not configured: '+row.currency);
  let value=decimal(row.amount);
  if(row.currency!==options.base){
   if(options.mode==='One Currency')throw Error('Currency must match the base currency');
   const key=[row.currency,method==='Historical'?row.date:row.period,method].join('|');
   if(!options.rates||options.rates[key]===undefined)throw Error('Missing exchange rate: '+key);
   const rate=decimal(options.rates[key]);if(rate<=0n)throw Error('Invalid exchange rate');
   value=value*rate/100000000n;
  }
  const pair=[row.entity,row.counterparty].sort(),key=JSON.stringify([pair,row.period,row.account,row.statement,category]);
  if(!groups.has(key))groups.set(key,{pair,period:row.period,account:row.account,statement:row.statement,category,reference:'',left:[],right:[],left_total:0n,right_total:0n});
  const group=groups.get(key),side=row.entity===pair[0]?'left':'right';
  group[side].push({...row,converted:decimalText(value),conversion_method:row.currency!==options.base?method:null});group[side+'_total']+=value;
 }
 const results=[...groups.values()].map(group=>{const difference=group.left_total+group.right_total;return {...group,status:group.left.length&&group.right.length&&(difference<0n?-difference:difference)<=tolerance?'Matched':'Exception',difference:decimalText(difference),left_total:decimalText(group.left_total),right_total:decimalText(group.right_total)};});
 return {options,rows:rows.length,results};
}
async function api(path,payload){
 if(!browserState){
  const saved=localStorage.getItem(storageKey);
  if(saved)browserState=JSON.parse(saved);
  else{const response=await fetch('./state.json');if(!response.ok)throw Error('Unable to load data');browserState=await response.json();}
 }
 if(path==='state'&&!payload)return structuredClone(browserState);
 const workspace=structuredClone(browserState),created=new Date().toISOString(),id=crypto.randomUUID();
 if(path==='import'){
  const rows=importRows(payload,workspace);
  workspace.imports.push({id,name:payload.name,created,company_id:payload.company_id,data:JSON.stringify(rows)});
 }else if(path==='company'){
  const name=String(payload.name||'').trim();if(!name||name.length>200)throw Error('Invalid company name');
  if(workspace.companies.some(item=>item.name.toLowerCase()===name.toLowerCase()))throw Error('The company already exists');
  workspace.companies.push({id,name});
 }else if(path==='mapping'){
  const mapping=workspace.mappings.find(item=>item.name===payload.name);if(!mapping)throw Error('Unknown mapping');
  if(!payload.data||typeof payload.data!=='object'||Array.isArray(payload.data)||Object.values(payload.data).some(value=>typeof value!=='string'))throw Error('Invalid column mapping');
  mapping.data=JSON.stringify(payload.data);
 }else if(path==='settings'){
  const settings=payload;
  if(!['One Currency','Multi Currency'].includes(settings.mode)||!settings.currencies.includes(settings.base)||settings.currencies.some(value=>!(/^[A-Z]{3}$/).test(value))||(settings.mode==='One Currency'?settings.currencies.length!==1:settings.currencies.length<2)||decimal(settings.tolerance)<0n)throw Error('Invalid currency settings');
  if(['Balance','P&L','Patrimonio'].some(category=>!['Closing','Average','Historical'].includes(settings.methods[category])))throw Error('Invalid conversion methods');
  workspace.settings=settings;
 }else if(path==='reconcile'){
  const rows=workspace.imports.filter(item=>payload.imports.includes(item.id)).flatMap(item=>JSON.parse(item.data));
  if(!rows.length)throw Error('Select at least one import');
  const result=browserReconcile(rows,{...payload.options,...workspace.settings,matching:'Balances'});
  workspace.history.push({id,created,data:JSON.stringify(result)});
 }else throw Error('Unknown operation');
 try{localStorage.setItem(storageKey,JSON.stringify(workspace));}catch(error){throw Error('Unable to save: browser storage is full or unavailable. No changes were applied.');}
 browserState=workspace;return {ok:true};
}

async function action(callback){try{document.querySelector('#notice').textContent='';await callback()}catch(error){document.querySelector('#notice').textContent=error.message}}
async function refresh(){state=await api('state');document.querySelector('header span').textContent=state.demo?'LUMA GROUP':'LOCAL WORKSPACE';render()}

const money=(value,currency='EUR')=>new Intl.NumberFormat('en-GB',{style:'currency',currency,maximumFractionDigits:0}).format(Number(value));
function dashboard(run){
 const results=run?.results||[],matched=results.filter(row=>row.status==='Matched'),exceptions=results.filter(row=>row.status==='Exception');
 const percentage=results.length?Math.round(matched.length/results.length*100):0;
 const base=run?.options.base||state.settings.base;
 const period=results.length?[...new Set(results.map(row=>row.period))].join(' · '):'No runs yet';
 return `<div class="topline"><h2>Reconciliation status</h2><span class="badge">${escapeHTML(period)}</span></div>
 <div class="card" style="margin-bottom:24px"><div class="section-head"><h3>${results.length?(exceptions.length?'Review required':'Reconciliation complete'):'No reconciliations yet'}</h3><span class="badge">${run?.rows||0} records</span></div><div class="ring" style="background:${results.length?'conic-gradient(#16826b 0% '+percentage+'%,#edb66a '+percentage+'% 100%)':'#edf1ee'}"><strong>${results.length?percentage+'%':'—'}<small>matched</small></strong></div><div class="legend"><span><i class="dot"></i>${matched.length} matched</span><span><i class="dot amber"></i>${exceptions.length} exceptions</span></div></div>
 <div class="card"><div class="section-head"><h3>Exceptions requiring attention</h3><button onclick="tab='Exceptions';render()">View exceptions →</button></div><div class="table-wrap"><table><thead><tr><th>Companies</th><th>Account / category</th><th>Status</th><th class="amount">Difference</th></tr></thead><tbody>${exceptions.map(row=>`<tr><td><strong>${escapeHTML(row.pair.join(' ↔ '))}</strong></td><td>${escapeHTML(row.account)} · ${escapeHTML(accountingLabel(row.category||row.statement))}</td><td><span class="pill">Review required</span></td><td class="amount">${money(row.difference,base)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No exceptions in the selected run.</td></tr>'}</tbody></table></div></div>

 `;
}
function reconciliationForm(run){return ` <details class="card" style="margin-top:24px"><summary>Run a new reconciliation</summary><div class="grid"><div><p>Select the imports for the period you want to reconcile.</p>${state.imports.map(item=>`<label><input type="checkbox" name="imports" value="${item.id}"> ${escapeHTML(item.name)}</label>`).join('')}</div><div><label>Exchange rates<textarea id="rates" aria-label="Exchange rates">${escapeHTML(JSON.stringify(run?.options.rates||{},null,2))}</textarea></label><p class="footnote">Base currency units per source currency unit. Closing/Average by period; Historical by date.</p></div></div><button onclick="action(runReconciliation)">Reconcile and save</button></details>`;}


const preciseMoney=(value,currency)=>new Intl.NumberFormat('en-GB',{style:'currency',currency,minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(value));
function exceptionTable(row,base){
 const references=new Map();
 for(const side of ['left','right'])for(const entry of row[side]){
  const key=entry.reference||'No reference';
  if(!references.has(key))references.set(key,{left:[],right:[]});
  references.get(key)[side].push(entry);
 }
 const lines=[...references].map(([reference,sides])=>{
  const total=side=>sides[side].reduce((sum,entry)=>sum+Number(entry.converted),0);
  const cells=['left','right'].map(side=>`<td class="amount">${sides[side].length?preciseMoney(total(side),base):'—'}<div class="footnote">${sides[side].map(entry=>escapeHTML(preciseMoney(entry.amount,entry.currency))).join(' + ')||'No counterpart'}</div></td>`).join('');
  return `<tr><td><strong>${escapeHTML(reference)}</strong></td>${cells}<td class="amount" style="color:#a86b21;font-weight:700">${preciseMoney(total('left')+total('right'),base)}</td></tr>`;
 }).join('');
 return `<div class="card"><div class="section-head"><div><h3>${escapeHTML(row.pair.join(' ↔ '))}</h3><p class="subtitle">Account ${escapeHTML(row.account)} · ${escapeHTML(accountingLabel(row.category||row.statement))} · ${escapeHTML(row.period)}</p></div><span class="pill">Review required</span></div><div class="table-wrap"><table class="exception-comparison" style="margin-top:18px"><thead><tr><th>Reference</th><th class="amount">${escapeHTML(row.pair[0])}</th><th class="amount">${escapeHTML(row.pair[1])}</th><th class="amount">Difference · ${escapeHTML(base)}</th></tr></thead><tbody>${lines}</tbody><tfoot><tr style="background:#f5f8f5"><td><strong>Total</strong></td><td class="amount"><strong>${preciseMoney(row.left_total,base)}</strong></td><td class="amount"><strong>${preciseMoney(row.right_total,base)}</strong></td><td class="amount"><strong>${preciseMoney(row.difference,base)}</strong></td></tr></tfoot></table></div></div>`;
}

function latest(){return state.history.find(item=>item.id===selectedHistory)||state.history.at(-1)}
function render(){document.querySelector('#nav').innerHTML=tabs.map(name=>`<button class="${tab===name?'active':''}" onclick="tab='${name}';render()">${name}</button>`).join('');const record=latest(),run=record?JSON.parse(record.data):null;let html='';
if(tab==='Dashboard')html=dashboard(state.history.length?JSON.parse(state.history.at(-1).data):null);
if(tab==='Imports'){html=`<h2>Imports</h2><p class="subtitle">Files are processed and saved in this browser. They are not sent to a server. Clearing browser data deletes this workspace.</p><div class="card"><p>Use UTF-8 CSV files with a decimal point for amounts. Opposing balances must have opposite signs. The account field must contain the common reconciliation key.</p><label>Company <select id="importCompany" required><option value="">Select a company</option>${state.companies.map(company=>`<option value="${company.id}">${escapeHTML(company.name)}</option>`).join('')}</select></label>${state.companies.length?'':'<p>Add your companies in Settings first.</p>'}<label>Mapping <select id="importMapping">${state.mappings.map(item=>`<option value="${escapeHTML(item.name)}">${escapeHTML(mappingLabel(item.name))}</option>`).join('')}</select></label><label>CSV file <input id="file" type="file" accept=".csv"></label><button onclick="action(upload)" ${state.companies.length?'':'disabled'}>Import</button></div>`}
if(tab==='Imports')html+=reconciliationForm(run);
if(tab==='Exceptions'){html=`<h2>Exceptions</h2><p class="subtitle">Differences requiring your attention · ${record?escapeHTML(record.created):'No runs yet'}</p><div style="height:24px"></div>`+(run?run.results.filter(row=>row.status==='Exception').map(row=>exceptionTable(row,run.options.base||'EUR')).join('')||'<div class="card">No exceptions.</div>':'<div class="card">Run a reconciliation in Imports.</div>')}
if(tab==='History'){html='<h2>History</h2>'+state.history.slice().reverse().map(item=>{const data=JSON.parse(item.data);return `<div class="card"><h3>${escapeHTML(item.created)}</h3><p>${data.rows} records · ${escapeHTML(data.options.matching)} · ${escapeHTML(data.options.mode)} · ${data.results.filter(row=>row.status==='Matched').length} matched groups</p><button onclick="selectedHistory='${item.id}';tab='Exceptions';render()">View exceptions</button> <button onclick="download('${item.id}')">Download CSV</button> <button onclick="action(()=>downloadExcel('${item.id}'))">Download Excel</button></div>`}).join('')}
if(tab==='History')html+=`<h3>Import history</h3><div class="card">${state.imports.map(item=>`<p>${escapeHTML(state.companies.find(company=>company.id===item.company_id)?.name||'Earlier import without an assigned company')} · ${escapeHTML(item.name)} · ${JSON.parse(item.data).length} records · ${escapeHTML(item.created)}</p>`).join('')||'No imports yet.'}</div>`;
if(tab==='Mappings'){html='<h2>Mappings</h2><p>Six global column mappings. Changes apply to new imports.</p><div class="grid">'+state.mappings.map((item,index)=>`<div class="card"><h3>${escapeHTML(mappingLabel(item.name))}</h3><textarea id="mapping${index}" aria-label="${escapeHTML(item.name)}">${escapeHTML(JSON.stringify(JSON.parse(item.data),null,2))}</textarea><button onclick="action(()=>saveMapping(${index}))">Save</button></div>`).join('')+'</div>'}
if(tab==='Settings'){html=`<h2>Settings</h2><div class="card"><h3>Companies</h3><p>These companies will appear in the Imports list.</p><ul>${state.companies.map(company=>`<li>${escapeHTML(company.name)}</li>`).join('')||'<li>No companies configured.</li>'}</ul><label>Company name <input id="newCompany" maxlength="200" placeholder="Company name"></label><button onclick="action(addCompany)">Add company</button><p id="companySaved" role="status"></p></div><div class="card"><h3>Working currencies</h3><label>Currency mode <select id="currencyMode" onchange="currencyFields()"><option ${state.settings.mode==='One Currency'?'selected':''}>One Currency</option><option ${state.settings.mode==='Multi Currency'?'selected':''}>Multi Currency</option></select></label><div id="currencyFields"></div><h3>Conversion methods</h3>${['Balance','P&L','Patrimonio'].map((category,index)=>`<label>${escapeHTML(accountingLabel(category))} = Method <select data-conversion-method id="method${index}">${['Closing','Average','Historical'].map(method=>`<option ${state.settings.methods[category]===method?'selected':''}>${method}</option>`).join('')}</select></label>`).join('')}<label>Tolerance <input id="tolerance" value="${escapeHTML(state.settings.tolerance)}" type="number" min="0" step="any" required></label><button onclick="action(saveSettings)">Save settings</button><p id="settingsSaved" role="status"></p></div>`}
document.querySelector('#main').innerHTML=html;
if(tab==='Settings')currencyFields()}
function currencyFields(){const multi=document.querySelector('#currencyMode').value==='Multi Currency';document.querySelectorAll('[data-conversion-method]').forEach(select=>select.disabled=!multi);document.querySelector('#currencyFields').innerHTML=multi?`<label>Currencies (comma-separated)<input id="currencies" value="${escapeHTML(state.settings.currencies.join(', '))}" placeholder="EUR, USD, GBP"></label><label>Base currency for reconciliation<input id="settingsBase" maxlength="3" value="${escapeHTML(state.settings.base)}"></label>`:`<label>Currency<input id="settingsBase" maxlength="3" value="${escapeHTML(state.settings.base)}" placeholder="EUR"></label>`}
async function saveSettings(){const mode=document.querySelector('#currencyMode').value;const base=document.querySelector('#settingsBase').value.trim().toUpperCase();const currencies=mode==='One Currency'?[base]:document.querySelector('#currencies').value.split(',').map(value=>value.trim().toUpperCase()).filter(Boolean);const methods=Object.fromEntries(['Balance','P&L','Patrimonio'].map((category,index)=>[category,document.querySelector('#method'+index).value]));const tolerance=document.querySelector('#tolerance').value;if(tolerance.trim()===''||!Number.isFinite(Number(tolerance))||Number(tolerance)<0)throw Error('Enter a tolerance of zero or greater');await api('settings',{mode,base,currencies,methods,tolerance});await refresh();document.querySelector('#settingsSaved').textContent='Settings saved.'}
async function addCompany(){const name=document.querySelector('#newCompany').value.trim();if(!name)throw Error('Enter the company name');await api('company',{name});state=await api('state');const card=document.querySelector('#newCompany').closest('.card');card.querySelector('ul').innerHTML=state.companies.map(company=>`<li>${escapeHTML(company.name)}</li>`).join('');document.querySelector('#newCompany').value='';document.querySelector('#companySaved').textContent='Company added to the list.'}
async function upload(){const company_id=document.querySelector('#importCompany').value;if(!company_id)throw Error('Select a company from the list');const file=document.querySelector('#file').files[0];if(!file)throw Error('Select a file');await api('import',{company_id,name:file.name,csv:await file.text(),mapping:document.querySelector('#importMapping').value});await refresh();document.querySelector('#notice').textContent='File imported and ready to reconcile. Import recorded in History.'}
async function saveMapping(index){const data=JSON.parse(document.querySelector('#mapping'+index).value);await api('mapping',{name:state.mappings[index].name,data});await refresh()}
async function runReconciliation(){const options={};options.rates=JSON.parse(document.querySelector('#rates').value);await api('reconcile',{options,imports:[...document.querySelectorAll('[name=imports]:checked')].map(item=>item.value)});selectedHistory=null;tab='Exceptions';await refresh()}

function excelWorkbook(data,created){
 const xml=value=>String(value??'').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
 const number=value=>Number.isFinite(Number(value))?Number(value):String(value??'');
 const summary=[['Company A','Company B','Period','Account','Statement','Category','Reference','Status','Company A total','Company B total','Difference','Base currency'],...data.results.map(row=>[...row.pair,row.period,row.account,accountingLabel(row.statement),accountingLabel(row.category||row.statement),row.reference,row.status,number(row.left_total),number(row.right_total),number(row.difference),data.options.base||'EUR'])];
 const details=[['Company','Counterparty','Account','Period','Date','Reference','Statement','Category','Original amount','Currency','Converted amount','Base currency','Conversion method','Status']];
 for(const group of data.results)for(const side of ['left','right'])for(const row of group[side])details.push([row.entity,row.counterparty,row.account,row.period,row.date,row.reference,accountingLabel(row.statement),accountingLabel(row.category||row.statement),number(row.amount),row.currency,number(row.converted),data.options.base||'EUR',row.conversion_method||'Not required',group.status]);
 const settings=[['Setting','Value'],['Created',created],['Records',data.rows],['Currency mode',data.options.mode],['Base currency',data.options.base||'EUR'],['Tolerance',number(data.options.tolerance||0)],...Object.entries(data.options.methods||{}).map(([category,method])=>[accountingLabel(category)+' method',method]),...Object.entries(data.options.rates||{}).map(([key,rate])=>['Exchange rate: '+key,number(rate)])];
 const ns='http://schemas.openxmlformats.org/spreadsheetml/2006/main';
 const sheets=[['Reconciliation',summary],['Transactions',details],['Settings',settings]];
 const sheetXML=rows=>'<worksheet xmlns="'+ns+'"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols><col min="1" max="'+rows[0].length+'" width="22" customWidth="1"/></cols><sheetData>'+rows.map((row,index)=>'<row r="'+(index+1)+'">'+row.map(value=>typeof value==='number'?'<c t="n"><v>'+value+'</v></c>':'<c t="inlineStr"><is><t xml:space="preserve">'+xml(value)+'</t></is></c>').join('')+'</row>').join('')+'</sheetData></worksheet>';
 const rel='http://schemas.openxmlformats.org/package/2006/relationships';
 const office='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
 const files={
 '[Content_Types].xml':'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+sheets.map((sheet,index)=>'<Override PartName="/xl/worksheets/sheet'+(index+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('')+'</Types>',
 '_rels/.rels':'<Relationships xmlns="'+rel+'"><Relationship Id="rId1" Type="'+office+'/officeDocument" Target="xl/workbook.xml"/></Relationships>',
 'xl/workbook.xml':'<workbook xmlns="'+ns+'" xmlns:r="'+office+'"><sheets>'+sheets.map((sheet,index)=>'<sheet name="'+sheet[0]+'" sheetId="'+(index+1)+'" r:id="rId'+(index+1)+'"/>').join('')+'</sheets></workbook>',
 'xl/_rels/workbook.xml.rels':'<Relationships xmlns="'+rel+'">'+sheets.map((sheet,index)=>'<Relationship Id="rId'+(index+1)+'" Type="'+office+'/worksheet" Target="worksheets/sheet'+(index+1)+'.xml"/>').join('')+'</Relationships>'
 };
 sheets.forEach((sheet,index)=>files['xl/worksheets/sheet'+(index+1)+'.xml']=sheetXML(sheet[1]));
 const encoder=new TextEncoder(),local=[],central=[];let offset=0;
 const crc32=bytes=>{let crc=0xffffffff;for(const byte of bytes){crc^=byte;for(let bit=0;bit<8;bit++)crc=(crc>>>1)^((crc&1)?0xedb88320:0);}return (crc^0xffffffff)>>>0;};
 for(const [path,content]of Object.entries(files)){
  const name=encoder.encode(path),bytes=encoder.encode(content),crc=crc32(bytes);
  const header=new Uint8Array(30+name.length),view=new DataView(header.buffer);
  view.setUint32(0,0x04034b50,true);view.setUint16(4,20,true);view.setUint16(12,33,true);view.setUint32(14,crc,true);view.setUint32(18,bytes.length,true);view.setUint32(22,bytes.length,true);view.setUint16(26,name.length,true);header.set(name,30);
  local.push(header,bytes);
  const directory=new Uint8Array(46+name.length),entry=new DataView(directory.buffer);
  entry.setUint32(0,0x02014b50,true);entry.setUint16(4,20,true);entry.setUint16(6,20,true);entry.setUint16(14,33,true);entry.setUint32(16,crc,true);entry.setUint32(20,bytes.length,true);entry.setUint32(24,bytes.length,true);entry.setUint16(28,name.length,true);entry.setUint32(42,offset,true);directory.set(name,46);central.push(directory);offset+=header.length+bytes.length;
 }
 const size=central.reduce((total,entry)=>total+entry.length,0),end=new Uint8Array(22),view=new DataView(end.buffer);
 view.setUint32(0,0x06054b50,true);view.setUint16(8,central.length,true);view.setUint16(10,central.length,true);view.setUint32(12,size,true);view.setUint32(16,offset,true);
 const archive=new Uint8Array(offset+size+22);let cursor=0;for(const part of [...local,...central,end]){archive.set(part,cursor);cursor+=part.length;}return archive;
}
function downloadExcel(id){
 const item=state.history.find(row=>row.id===id);
 const bytes=excelWorkbook(JSON.parse(item.data),item.created);
 const url=URL.createObjectURL(new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
 const link=document.createElement('a');link.href=url;link.download='reconciliation-'+id+'.xlsx';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function download(id,json=false){const item=state.history.find(row=>row.id===id),data=JSON.parse(item.data);const fields=['pair','period','account','statement','reference','status','left_total','right_total','difference'];const quote=value=>'"'+String(value??'').replace(/"/g,'""')+'"';const content=json?JSON.stringify(data,null,2):[fields.join(','),...data.results.map(row=>fields.map(field=>quote(Array.isArray(row[field])?row[field].join(' / '):row[field])).join(','))].join('\r\n');const url=URL.createObjectURL(new Blob([content],{type:json?'application/json':'text/csv;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download='reconciliation-'+id+(json?'.json':'.csv');link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
action(refresh);
</script></html>
